<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitOnMe - Virtual Try-On AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['ui-sans-serif', 'system-ui', 'sans-serif'],
              'display': ['Georgia', 'serif'],
            },
            colors: {
              'primary': {
                'DEFAULT': '#C8A2C8', // Lilac
                'hover': '#A475A4',   // Darker Lilac
                'light': '#F2E8F2',  // Very light lilac
              },
              'secondary': {
                'DEFAULT': '#EADDCA', // Soft beige/gold
                'hover': '#D4C8B5',   // Darker beige
              },
              'background': '#FDFCFB', // Warm off-white
              'text-main': '#4B4242',   // Soft, dark brown
              'text-muted': '#8A7F7F',  // Muted, warm gray
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: 0, transform: 'translateY(10px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
            },
            boxShadow: {
              'soft': '0 4px 15px rgba(75, 66, 66, 0.05)',
              'soft-lg': '0 10px 30px rgba(75, 66, 66, 0.07)',
            }
          }
        }
      }
    </script>
